[project]
name = "cis525-artificial-intelligence"
version = "0.1.0"
description = "Artificial Intelligence / Inteligjenca Artificiale (CIS525): seminar exercises"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "ipykernel==7.2.0",
    "ipywidgets==8.1.8",
    "jupyterlab==4.6.6",
    "matplotlib==3.11.2",
    "nbclient==0.11.0",
    "nbformat==5.11.1",
    "pandas==3.1.1",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I", "B", "UP"]

